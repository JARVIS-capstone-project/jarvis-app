<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/branding/logo/jarvis.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="J.A.R.V.I.S — AI-driven decision support for banking incident triage. Cited, streamed recommendations."
    />
    <title>J.A.R.V.I.S — Banking Incident Triage</title>

    <!-- Canonical -->
    <link rel="canonical" href="https://thejarvis.tech/" />

    <!-- Open Graph — Facebook, LinkedIn, iMessage, Slack, Discord, WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thejarvis.tech/" />
    <meta property="og:site_name" content="J.A.R.V.I.S" />
    <meta property="og:title" content="J.A.R.V.I.S — Banking Incident Triage" />
    <meta
      property="og:description"
      content="AI-driven decision support for banking incident triage. Cited, streamed recommendations."
    />
    <meta property="og:image" content="https://thejarvis.tech/og/jarvis-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="J.A.R.V.I.S — Triage the incident. Cite the source."
    />

    <!-- Twitter / X — summary_large_image renders the picture full-width -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="J.A.R.V.I.S — Banking Incident Triage" />
    <meta
      name="twitter:description"
      content="AI-driven decision support for banking incident triage. Cited, streamed recommendations."
    />
    <meta name="twitter:image" content="https://thejarvis.tech/og/jarvis-og.png" />

    <!-- Mobile browser chrome color (brand orange) -->
    <meta name="theme-color" content="#fe6128" />
    <!-- Set the theme class before first paint to avoid a light flash for dark users. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
